<!doctype html>
<html><head><meta charset="utf-8"><title>Atrium</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#f4f1ea;color:#1d1b18;font-family:Inter,system-ui,sans-serif;overflow:hidden}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 180px}
  .eyebrow{font-size:20px;letter-spacing:.22em;text-transform:uppercase;color:#7b7266;opacity:0;transform:translateY(14px);animation:in .9s .15s forwards cubic-bezier(.2,.8,.2,1)}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:118px;line-height:1.02;letter-spacing:-.01em;margin:22px 0 26px;opacity:0;transform:translateY(22px);animation:in 1s .3s forwards cubic-bezier(.2,.8,.2,1)}
  h1 em{font-style:italic;color:#8a6e4b}
  p{font-size:28px;line-height:1.5;color:#5c5650;max-width:1150px;margin:0;opacity:0;transform:translateY(14px);animation:in .9s .55s forwards cubic-bezier(.2,.8,.2,1)}
  .rule{position:absolute;left:180px;bottom:120px;width:0;height:1px;background:#cdbfa8;animation:grow 1.4s .4s forwards cubic-bezier(.2,.8,.2,1)}
  .brand{position:absolute;left:180px;bottom:70px;font-size:18px;font-weight:600;letter-spacing:.02em;color:#7b7266}
  @keyframes in{to{opacity:1;transform:none}} @keyframes grow{to{width:calc(100% - 360px)}}
</style></head>
<body><div class="wrap"><div class="eyebrow" id="e"></div><h1 id="t"></h1><p id="s"></p></div><div class="rule"></div><div class="brand">Atrium · website platform tutorial</div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('e').textContent = q.get('eyebrow') || '';
document.getElementById('t').innerHTML = (q.get('title') || '').replace(/\*(.+?)\*/g, '<em>$1</em>');
document.getElementById('s').textContent = q.get('subtitle') || '';
</script></body></html>
