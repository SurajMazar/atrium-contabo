apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: atrium-redis
  labels: { app.kubernetes.io/name: atrium-redis }
spec:
  serviceName: atrium-redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: atrium-redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: atrium-redis }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: docker.io/library/redis:7-alpine
          args: ["--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: atrium-redis
  labels: { app.kubernetes.io/name: atrium-redis }
spec:
  selector: { app.kubernetes.io/name: atrium-redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-from-atrium
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: atrium-redis }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [atrium-api, atrium-worker] }
      ports: [{ port: 6379 }]
