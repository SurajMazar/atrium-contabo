# Optional, NON-HA PostgreSQL + Redis inside the cluster — for staging, previews and demos.
# Production should use managed PostgreSQL/Redis (RDS/Cloud SQL/Azure Flexible Server,
# ElastiCache/Memorystore/Azure Cache) or an operator (CloudNativePG, Redis Operator).
# With this component, set in secrets.env:
#   POSTGRES_PASSWORD=<random>  DATABASE_URL=postgresql://atrium:<same>@atrium-postgres:5432/atrium
#   REDIS_URL=redis://atrium-redis:6379
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - postgres.yaml
  - redis.yaml
