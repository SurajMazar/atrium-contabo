# Applies pending Prisma migrations (`prisma migrate deploy`). Run it before rolling out new
# api/worker images. Jobs are immutable, so re-create it per release:
#   kubectl -n atrium delete job atrium-migrate --ignore-not-found
#   kubectl kustomize overlays/production | kubectl apply -f - && kubectl -n atrium wait --for=condition=complete job/atrium-migrate --timeout=10m
# Argo CD runs it automatically as a PreSync hook (annotations below).
apiVersion: batch/v1
kind: Job
metadata:
  name: atrium-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: atrium-migrate, app.kubernetes.io/component: migrate }
    spec:
      serviceAccountName: atrium
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: ghcr.io/your-org/atrium-migrate
          envFrom:
            - configMapRef: { name: atrium-config }
            - secretRef: { name: atrium-secrets }
          env:
            - { name: CHECKPOINT_DISABLE, value: '1' }
            - { name: HOME, value: /tmp }
            # Least-privilege DB roles: when secrets.env has MIGRATE_DATABASE_URL (owner role), migrations
            # use it and DATABASE_URL can be the DML-only app role (docs/deployment/kubernetes.md).
            # Without the key the Job falls back to DATABASE_URL from envFrom.
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: atrium-secrets, key: MIGRATE_DATABASE_URL, optional: true } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
