# Public site renderer (Next.js, multi-tenant by Host header, ISR).
# Each replica keeps its own ISR cache in an emptyDir; the API's POST /api/revalidate must
# reach every replica — it can target the headless Service below (atrium-renderer-peers)
# to fan out, or configure a shared Next.js cacheHandler (e.g. Redis) instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atrium-renderer
  labels: { app.kubernetes.io/name: atrium-renderer, app.kubernetes.io/component: renderer }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: atrium-renderer }
  template:
    metadata:
      labels: { app.kubernetes.io/name: atrium-renderer, app.kubernetes.io/component: renderer }
    spec:
      serviceAccountName: atrium
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: atrium-renderer } }
      containers:
        - name: renderer
          image: ghcr.io/your-org/atrium-renderer
          ports: [{ name: http, containerPort: 3001 }]
          envFrom:
            - configMapRef: { name: atrium-config }
            - secretRef: { name: atrium-secrets }
          env:
            - { name: PORT, value: "3001" }
            - { name: HOSTNAME, value: "0.0.0.0" }
          # Unknown hosts legitimately return 404, so probe the socket rather than "/".
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 15
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          lifecycle:
            preStop: { exec: { command: ["sleep", "5"] } }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            # Next.js writes to .next/cache (mounted below); the rest of the image stays immutable.
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: next-cache, mountPath: /app/apps/renderer/.next/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: next-cache, emptyDir: { sizeLimit: 2Gi } }
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: atrium-renderer
  labels: { app.kubernetes.io/name: atrium-renderer }
spec:
  selector: { app.kubernetes.io/name: atrium-renderer }
  ports: [{ name: http, port: 3001, targetPort: http }]
---
# Headless: resolves to every ready renderer pod (for revalidation fan-out).
apiVersion: v1
kind: Service
metadata:
  name: atrium-renderer-peers
  labels: { app.kubernetes.io/name: atrium-renderer }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: atrium-renderer }
  ports: [{ name: http, port: 3001, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: atrium-renderer
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: atrium-renderer }
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: atrium-renderer
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: atrium-renderer } }
