apiVersion: apps/v1
kind: Deployment
metadata:
  name: atrium-api
  labels: { app.kubernetes.io/name: atrium-api, app.kubernetes.io/component: api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: atrium-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: atrium-api, app.kubernetes.io/component: api }
    spec:
      serviceAccountName: atrium
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: atrium-api } }
      containers:
        - name: api
          image: ghcr.io/your-org/atrium-api
          ports: [{ name: http, containerPort: 4000 }]
          envFrom:
            - configMapRef: { name: atrium-config }
            - secretRef: { name: atrium-secrets }
          env:
            - { name: PORT, value: "4000" }
          startupProbe:
            httpGet: { path: /v1/health, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /v1/health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet: { path: /v1/health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # let the Service/Ingress stop routing before SIGTERM
            preStop: { exec: { command: ["sleep", "5"] } }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 512Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: atrium-api
  labels: { app.kubernetes.io/name: atrium-api }
spec:
  selector: { app.kubernetes.io/name: atrium-api }
  ports: [{ name: http, port: 4000, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: atrium-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: atrium-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: atrium-api
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: atrium-api } }
