# Default-deny ingress; only the ingress controller reaches the public services, and only
# Atrium components reach the API/renderer. Egress stays open for managed PostgreSQL/Redis/S3,
# SMTP, AI and deployment providers (tighten with your provider CIDRs if required).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
spec:
  podSelector:
    matchExpressions:
      - {
          key: app.kubernetes.io/name,
          operator: In,
          values: [atrium-api, atrium-admin, atrium-renderer],
        }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-api
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: atrium-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {
                  key: app.kubernetes.io/name,
                  operator: In,
                  values: [atrium-admin, atrium-renderer, atrium-worker],
                }
      ports: [{ port: 4000 }]
---
# API → renderer for on-publish revalidation (POST /api/revalidate with X-Renderer-Secret).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-revalidate
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: atrium-renderer }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [atrium-api, atrium-worker] }
      ports: [{ port: 3001 }]
