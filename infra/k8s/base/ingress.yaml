# ingress-nginx + cert-manager. Two Ingresses because the wildcard certificate for tenant
# subdomains needs a DNS-01 issuer, while admin/api use HTTP-01.
# Customer domains: add one Ingress (or host rule) per verified domain with the
# letsencrypt-http01 issuer — see docs/deployment/kubernetes.md#custom-domains.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atrium-platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-read-timeout: '120'
    # Server-Sent Events (AI generation progress)
    nginx.ingress.kubernetes.io/proxy-buffering: 'off'
spec:
  ingressClassName: nginx
  tls:
    - hosts: [admin.example.com, api.example.com]
      secretName: atrium-platform-tls
  rules:
    - host: admin.example.com
      http:
        paths:
          - {
              path: /,
              pathType: Prefix,
              backend: { service: { name: atrium-admin, port: { name: http } } },
            }
    - host: api.example.com
      http:
        paths:
          - {
              path: /,
              pathType: Prefix,
              backend: { service: { name: atrium-api, port: { name: http } } },
            }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atrium-sites
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [sites.example.com, '*.sites.example.com']
      secretName: atrium-sites-wildcard-tls
  rules:
    - host: sites.example.com
      http:
        paths:
          - {
              path: /,
              pathType: Prefix,
              backend: { service: { name: atrium-renderer, port: { name: http } } },
            }
    - host: '*.sites.example.com'
      http:
        paths:
          - {
              path: /,
              pathType: Prefix,
              backend: { service: { name: atrium-renderer, port: { name: http } } },
            }
