# Atrium — single-server production stack (Podman or Docker Compose): the application only.
#
#   atrium setup production --target podman --domain example.com   # writes deploy/podman/{compose.yaml,.env,…}
#   cd deploy/podman && podman compose up -d                        # or: docker compose up -d
#
# What runs: migrate (one-shot `prisma migrate deploy`), api, worker, renderer, admin. On every start the
# API also adds missing reference data, built-in roles and the first super admin (SEED_ADMIN_EMAIL /
# SEED_ADMIN_PASSWORD) — it never changes or deletes existing data.
#
# Bring your own services (set in .env):
#   PostgreSQL 15+   DATABASE_URL (app role) + MIGRATE_DATABASE_URL (owner role, migrations only)
#   Redis 7+         REDIS_URL (maxmemory-policy noeviction — BullMQ queues)
#   Storage          STORAGE_DRIVER=local (api-storage volume, served by the API) or S3_* for S3/R2/B2/…
#   Email            SMTP_* (or configure it later in the super-admin panel → Providers)
#   HTTPS / proxy    your reverse proxy → admin 127.0.0.1:3000, api 127.0.0.1:4000, renderer 127.0.0.1:3001
#                    (ATRIUM_BIND=0.0.0.0 publishes on every interface instead of loopback)
# Bundled alternatives are below, commented out — Caddy (automatic HTTPS), PostgreSQL, Redis and
# SeaweedFS (S3). Uncomment a service together with its `depends_on` entries and volume to use it.
#
# Networks: edge — app containers (egress allowed: database, Redis, SMTP, AI, webhooks, ACME);
#           data — internal (no egress), only used by the bundled postgres/redis/s3 when enabled.
#
# Per-service configuration: only api, worker and migrate read the full .env (env_file); renderer and
# admin receive just the variables they need through `environment:`.
name: atrium

x-app: &app
  env_file: [.env]
  restart: unless-stopped
  networks: [edge, data]

# Application containers: immutable root filesystem, no Linux capabilities, no privilege escalation.
# Writable paths are explicit: /tmp (tmpfs) plus the volumes declared per service.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  tmpfs: ['/tmp:size=256m,mode=1777']

services:
  # ── Optional: Caddy edge proxy (automatic + on-demand HTTPS). Off by default — put your own proxy
  #    (nginx, Traefik, a cloud load balancer) in front of 127.0.0.1:3000 / :4000 / :3001 instead.
  #    To use it: uncomment, and set ADMIN_HOST, API_HOST, SITES_DOMAIN, MEDIA_HOST and ACME_EMAIL.
  # caddy:
  #   image: docker.io/library/caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9
  #   restart: unless-stopped
  #   ports:
  #     - '80:80'
  #     - '443:443'
  #     - '443:443/udp'
  #   # Only what the Caddyfile reads.
  #   environment:
  #     ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
  #     ADMIN_HOST: ${ADMIN_HOST:?set ADMIN_HOST in .env}
  #     API_HOST: ${API_HOST:?set API_HOST in .env}
  #     SITES_DOMAIN: ${SITES_DOMAIN:?set SITES_DOMAIN in .env}
  #     MEDIA_HOST: ${MEDIA_HOST:?set MEDIA_HOST in .env}
  #     S3_BUCKET: ${S3_BUCKET:-atrium-media}
  #   volumes:
  #     - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro,Z
  #     - caddy-data:/data
  #     - caddy-config:/config
  #   cap_drop: [ALL]
  #   cap_add: [NET_BIND_SERVICE]
  #   security_opt: ['no-new-privileges:true']
  #   networks: [edge]
  #   depends_on: [api, admin, renderer]

  # ── Optional: bundled PostgreSQL. Off by default — point DATABASE_URL (app role) and
  #    MIGRATE_DATABASE_URL (owner role) at your own server. To use it: uncomment this service, the
  #    `postgres` depends_on entries in migrate/api/worker and the pg-data volume.
  # postgres:
  #   image: docker.io/library/postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
  #   restart: unless-stopped
  #   environment:
  #     # Owner/superuser role: migrations only (MIGRATE_DATABASE_URL).
  #     POSTGRES_USER: ${POSTGRES_USER:-atrium}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  #     POSTGRES_DB: ${POSTGRES_DB:-atrium}
  #     # DML-only application role created by postgres/initdb on first start (DATABASE_URL).
  #     POSTGRES_APP_USER: ${POSTGRES_APP_USER:-atrium_app}
  #     POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data
  #     - ./postgres/initdb:/docker-entrypoint-initdb.d:ro,Z
  #   shm_size: 256m
  #   healthcheck:
  #     test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-atrium} -d ${POSTGRES_DB:-atrium}']
  #     interval: 5s
  #     timeout: 3s
  #     retries: 30
  #   security_opt: ['no-new-privileges:true']
  #   networks: [data]

  # ── Optional: bundled Redis (BullMQ: noeviction + AOF). Off by default — set REDIS_URL to your own
  #    Redis 7+ (maxmemory-policy noeviction). To use it: uncomment this service, the `redis`
  #    depends_on entries in api/worker and the redis-data volume.
  # redis:
  #   image: docker.io/library/redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
  #   restart: unless-stopped
  #   # BullMQ requires noeviction; AOF keeps queued jobs across restarts. requirepass: every client
  #   # (api, worker) authenticates via REDIS_URL=redis://:<REDIS_PASSWORD>@redis:6379.
  #   command:
  #     [
  #       'redis-server',
  #       '--requirepass',
  #       '${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}',
  #       '--appendonly',
  #       'yes',
  #       '--appendfsync',
  #       'everysec',
  #       '--maxmemory-policy',
  #       'noeviction',
  #     ]
  #   environment:
  #     REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
  #   volumes: [redis-data:/data]
  #   healthcheck:
  #     test: ['CMD', 'redis-cli', 'ping']
  #     interval: 5s
  #     timeout: 3s
  #     retries: 30
  #   security_opt: ['no-new-privileges:true']
  #   networks: [data]
  #
  # Self-hosted S3 (SeaweedFS). Replace with AWS S3 / R2 / B2 / Azure by changing S3_* in .env
  # and removing this service + s3-init. -ip/-ip.bind=127.0.0.1 keeps master (9333), volume (8080),
  # filer (8888) and their gRPC ports container-local; -s3.ip.bind=0.0.0.0 exposes only the S3 gateway.
  # ── Optional: bundled S3-compatible storage (SeaweedFS) + bucket setup. Off by default — use
  #    STORAGE_DRIVER=local (the api-storage volume) or your own S3/R2/B2 via S3_* in .env.
  #    To use it: uncomment s3 and s3-init and the s3-data volume.
  # s3:
  #   image: docker.io/chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
  #   restart: unless-stopped
  #   command:
  #     [
  #       'server',
  #       '-dir=/data',
  #       '-ip=127.0.0.1',
  #       '-ip.bind=127.0.0.1',
  #       '-master.volumeSizeLimitMB=1024',
  #       '-volume.max=0',
  #       '-s3',
  #       '-s3.ip.bind=0.0.0.0',
  #       '-s3.port=8333',
  #       '-s3.config=/etc/seaweedfs/s3.json',
  #     ]
  #   volumes:
  #     - s3-data:/data
  #     - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro,Z
  #   healthcheck:
  #     test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1']
  #     interval: 10s
  #     timeout: 3s
  #     retries: 30
  #   security_opt: ['no-new-privileges:true']
  #   # edge: Caddy serves the public media bucket from the S3 gateway.
  #   networks: [edge, data]
  #
  # Creates the media bucket once. Shares the s3 container's network namespace because the master
  # only listens on 127.0.0.1.
  # s3-init:
  #   image: docker.io/chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
  #   depends_on:
  #     s3: { condition: service_healthy }
  #   network_mode: 'service:s3'
  #   entrypoint: ['/bin/sh', '-c']
  #   command:
  #     [
  #       "sleep 3; echo 's3.bucket.create -name ${S3_BUCKET:-atrium-media}' | weed shell -master=127.0.0.1:9333 || true",
  #     ]
  #   restart: 'no'

  migrate:
    <<: *app
    image: ${ATRIUM_IMAGE_REGISTRY:-localhost}/atrium-migrate:${ATRIUM_IMAGE_TAG:-latest}
    build:
      {
        context: '${ATRIUM_SRC_DIR:-..}',
        dockerfile: infra/containers/api.Containerfile,
        target: migrate,
      }
    restart: 'no'
    # Migrations run as the owner role; the app role (DATABASE_URL) cannot change the schema.
    environment:
      DATABASE_URL: ${MIGRATE_DATABASE_URL:?set MIGRATE_DATABASE_URL in .env (owner role)}
      CHECKPOINT_DISABLE: '1'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    # edge: reaches an external database; data: the bundled one (if enabled).
    networks: [edge, data]
    # depends_on:
    #   postgres: { condition: service_healthy }

  api:
    <<: [*app, *hardened]
    image: ${ATRIUM_IMAGE_REGISTRY:-localhost}/atrium-api:${ATRIUM_IMAGE_TAG:-latest}
    build: { context: '${ATRIUM_SRC_DIR:-..}', dockerfile: infra/containers/api.Containerfile }
    mem_limit: 1g
    # STORAGE_DRIVER=local: files live in the api-storage volume, shared with the worker at the same
    # absolute path (a relative LOCAL_STORAGE_DIR would resolve differently in each container).
    environment:
      LOCAL_STORAGE_DIR: /app/apps/api/storage
    volumes: [api-storage:/app/apps/api/storage]
    # Your reverse proxy forwards api.<domain> here (ATRIUM_BIND=0.0.0.0 to expose on all interfaces).
    ports: ['${ATRIUM_BIND:-127.0.0.1}:4000:4000']
    depends_on:
      # postgres: { condition: service_healthy }
      # redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  worker:
    <<: [*app, *hardened]
    image: ${ATRIUM_IMAGE_REGISTRY:-localhost}/atrium-worker:${ATRIUM_IMAGE_TAG:-latest}
    build: { context: '${ATRIUM_SRC_DIR:-..}', dockerfile: infra/containers/worker.Containerfile }
    mem_limit: 1536m
    # Opt-in local builds (WORKER_ENABLE_LOCAL_BUILDS=1) run npm in /tmp, so it is larger and exec.
    tmpfs: ['/tmp:size=2g,mode=1777,exec']
    environment:
      npm_config_cache: /tmp/.npm
      XDG_CACHE_HOME: /tmp/.cache
      LOCAL_STORAGE_DIR: /app/apps/api/storage
    # Same storage volume as the API (STORAGE_DRIVER=local): media processing reads originals, writes variants.
    volumes: [api-storage:/app/apps/api/storage]
    depends_on:
      # postgres: { condition: service_healthy }
      # redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  renderer:
    <<: *hardened
    image: ${ATRIUM_IMAGE_REGISTRY:-localhost}/atrium-renderer:${ATRIUM_IMAGE_TAG:-latest}
    build: { context: '${ATRIUM_SRC_DIR:-..}', dockerfile: infra/containers/renderer.Containerfile }
    restart: unless-stopped
    mem_limit: 1g
    # The renderer only needs its shared secret with the API and the public URLs.
    environment:
      NODE_ENV: production
      ATRIUM_API_INTERNAL_URL: http://api:4000
      API_URL: ${API_URL:?set API_URL in .env}
      RENDERER_URL: ${RENDERER_URL:?set RENDERER_URL in .env}
      # Draft previews (/_preview/…) are only served on this host.
      PREVIEW_URL: ${PREVIEW_URL:-}
      PLATFORM_SITES_DOMAIN: ${PLATFORM_SITES_DOMAIN:?set PLATFORM_SITES_DOMAIN in .env}
      RENDERER_SECRET: ${RENDERER_SECRET:?set RENDERER_SECRET in .env}
    volumes: [renderer-cache:/app/apps/renderer/.next/cache]
    # Published sites: <sites domain>, *.<sites domain> and custom domains.
    ports: ['${ATRIUM_BIND:-127.0.0.1}:3001:3001']
    networks: [edge]
    depends_on: [api]

  admin:
    <<: *hardened
    image: ${ATRIUM_IMAGE_REGISTRY:-localhost}/atrium-admin:${ATRIUM_IMAGE_TAG:-latest}
    build:
      context: '${ATRIUM_SRC_DIR:-..}'
      dockerfile: infra/containers/admin.Containerfile
      args: { ATRIUM_API_INTERNAL_URL: 'http://api:4000' }
    restart: unless-stopped
    # Room to buffer a proxied upload (site imports up to 300 MB) on top of Next.js itself.
    mem_limit: 1280m
    # Public URLs only — the admin holds no secrets (it proxies /api/* to the API).
    environment:
      NODE_ENV: production
      ATRIUM_API_INTERNAL_URL: http://api:4000
      API_URL: ${API_URL:?set API_URL in .env}
      ADMIN_URL: ${ADMIN_URL:?set ADMIN_URL in .env}
    volumes: [admin-cache:/app/apps/admin/.next/cache]
    ports: ['${ATRIUM_BIND:-127.0.0.1}:3000:3000']
    networks: [edge]
    depends_on: [api]

networks:
  edge: {}
  data:
    internal: true

volumes:
  # Bundled services (uncomment together with the service):
  # pg-data:
  # redis-data:
  # s3-data:
  # caddy-data:
  # caddy-config:
  renderer-cache:
  admin-cache:
  api-storage:
