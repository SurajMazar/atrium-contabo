# Atrium behind nginx (systemd / bare-metal topology). `atrium setup production --target systemd
# --domain your.tld` copies this file with example.com replaced by your domain.
#
#   admin.example.com      → admin    127.0.0.1:3000
#   api.example.com        → api      127.0.0.1:4000
#   sites.example.com      → renderer 127.0.0.1:3001
#   *.sites.example.com    → renderer (wildcard certificate — needs DNS-01, e.g. certbot --dns-cloudflare)
#   media.example.com      → object storage (only if you self-host S3; otherwise use your bucket/CDN URL)
#   customer domains       → renderer; nginx cannot issue certificates on demand, so either add one
#                            server block per verified domain under /etc/nginx/atrium-domains/ (certbot
#                            --nginx -d www.customer.com) or put Caddy in front (infra/caddy/Caddyfile).
#
# Requires nginx >= 1.25.1 (`http2 on;`). Certificates (Let's Encrypt):
#   certbot certonly --nginx -d admin.example.com -d api.example.com -d media.example.com
#   certbot certonly --dns-<provider> -d sites.example.com -d '*.sites.example.com'

upstream atrium_admin    { server 127.0.0.1:3000; keepalive 32; }
upstream atrium_api      { server 127.0.0.1:4000; keepalive 32; }
upstream atrium_renderer { server 127.0.0.1:3001; keepalive 64; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Shared proxy settings
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_read_timeout 120s;

# HTTP → HTTPS (keeps ACME HTTP-01 working for certbot --webroot)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.example.com;
    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 100m;
    location / { proxy_pass http://atrium_admin; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;
    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 100m;
    # Server-Sent Events (AI generation progress) must not be buffered.
    location ~ ^/v1/ai/generations/[^/]+/events$ {
        proxy_pass http://atrium_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location / { proxy_pass http://atrium_api; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sites.example.com *.sites.example.com;
    ssl_certificate     /etc/letsencrypt/live/sites.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sites.example.com/privkey.pem;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 25m;
    location / { proxy_pass http://atrium_renderer; }
}

# Self-hosted S3 media (read-only to the public). Remove if you use a managed bucket/CDN.
# Only object reads inside the media bucket are proxied (no other buckets, listings or S3 sub-resources);
# bind the S3 gateway to 127.0.0.1 and keep SeaweedFS master/volume/filer ports off public interfaces.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name media.example.com;
    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    location = /atrium-media/ { return 404; }
    location /atrium-media/ {
        limit_except GET HEAD { deny all; }
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        # plain object GETs only: no S3 sub-resources/queries (?acl, ?uploads, ?list-type…)
        if ($args) { return 400; }
        proxy_pass http://127.0.0.1:8333;
    }
    location / { return 404; }
}

# One file per verified customer domain (see header). Template:
#   server {
#       listen 443 ssl; listen [::]:443 ssl; http2 on;
#       server_name www.customer.com customer.com;
#       ssl_certificate     /etc/letsencrypt/live/www.customer.com/fullchain.pem;
#       ssl_certificate_key /etc/letsencrypt/live/www.customer.com/privkey.pem;
#       location / { proxy_pass http://atrium_renderer; }
#   }
include /etc/nginx/atrium-domains/*.conf;
