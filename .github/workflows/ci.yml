name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 2 * * *' # nightly: full e2e run
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the Playwright end-to-end suite
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  # Build-time value baked into the admin's /api rewrite; real deploys build images separately.
  ATRIUM_API_INTERNAL_URL: http://localhost:4000

jobs:
  verify:
    name: Lint · typecheck · test · build
    # Not in the Contabo mirror: its only pipeline is deploy-contabo.yml (push to main).
    if: github.repository != 'SurajMazar/atrium-contabo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Turborepo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: CLI smoke test
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          GIT_SHA: ${{ github.sha }}
        run: |
          pnpm atrium --help
          pnpm atrium --version
          pnpm atrium setup production --target podman --domain ci.example.com --out "$RUNNER_TEMP/podman"
          pnpm atrium setup production --target k8s --domain ci.example.com --registry "ghcr.io/$REPO_OWNER" --tag "$GIT_SHA" --out "$RUNNER_TEMP/k8s"
          pnpm atrium --root . setup check --env-file "$RUNNER_TEMP/podman/.env" || true

  manifests:
    name: Kubernetes + compose manifests
    # Not in the Contabo mirror: its only pipeline is deploy-contabo.yml (push to main).
    if: github.repository != 'SurajMazar/atrium-contabo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: kustomize build (base + overlays)
        run: |
          kubectl version --client
          kubectl kustomize infra/k8s/base > /dev/null
          for env in staging production; do
            cp infra/k8s/overlays/$env/secrets.env.example infra/k8s/overlays/$env/secrets.env
            kubectl kustomize infra/k8s/overlays/$env > "$RUNNER_TEMP/$env.yaml"
            echo "$env: $(grep -c '^kind:' "$RUNNER_TEMP/$env.yaml") resources"
          done
      - name: Validate against the Kubernetes API schemas
        env:
          # sha256 from the release's CHECKSUMS file (v0.6.7, kubeconform-linux-amd64.tar.gz)
          KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
        run: |
          curl -fsSLo "$RUNNER_TEMP/kubeconform.tar.gz" https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" kubeconform
          ./kubeconform -strict -summary -ignore-missing-schemas "$RUNNER_TEMP/staging.yaml" "$RUNNER_TEMP/production.yaml"
      - name: docker compose config
        run: |
          cp .env.example .env
          # Every variable compose.prod.yaml requires (`atrium setup production` generates real values).
          {
            printf 'ATRIUM_SRC_DIR=%s\n' "$PWD"
            printf '%s\n' POSTGRES_PASSWORD=ci POSTGRES_APP_PASSWORD=ci-app REDIS_PASSWORD=ci-redis \
              MIGRATE_DATABASE_URL=postgresql://atrium:ci@postgres:5432/atrium RENDERER_SECRET=ci-renderer-secret \
              ACME_EMAIL=ops@ci.example.com ADMIN_HOST=admin.ci.example.com API_HOST=api.ci.example.com \
              SITES_DOMAIN=sites.ci.example.com MEDIA_HOST=media.ci.example.com PLATFORM_SITES_DOMAIN=sites.ci.example.com \
              ADMIN_URL=https://admin.ci.example.com API_URL=https://api.ci.example.com RENDERER_URL=https://sites.ci.example.com
          } > infra/.env
          docker compose -f infra/compose.yaml config -q
          docker compose -f infra/compose.prod.yaml --env-file infra/.env config -q

  database:
    name: Prisma migrations (deploy + drift)
    # Not in the Contabo mirror: its only pipeline is deploy-contabo.yml (push to main).
    if: github.repository != 'SurajMazar/atrium-contabo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: atrium
          POSTGRES_PASSWORD: atrium
          POSTGRES_DB: atrium
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atrium -d atrium"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://atrium:atrium@localhost:5432/atrium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: prisma validate
        run: pnpm --filter @atrium/db exec prisma validate
      - name: migrate deploy (fresh database)
        run: pnpm db:deploy
      - name: migrate deploy is idempotent
        run: pnpm db:deploy
      - name: Drift check — schema.prisma must match the migrations
        run: |
          set +e
          pnpm --filter @atrium/db exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
          code=$?
          if [ "$code" = "2" ]; then
            echo "::error::schema.prisma has changes without a migration. Run: pnpm atrium migrate --dev --name <change>"
            pnpm --filter @atrium/db exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script
          fi
          exit $code
      - name: Seed (twice — must be idempotent)
        run: |
          pnpm exec turbo run build --filter=./packages/*
          pnpm db:seed
          pnpm db:seed

  e2e:
    name: Playwright end-to-end
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.e2e)
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env: { POSTGRES_USER: atrium, POSTGRES_PASSWORD: atrium, POSTGRES_DB: atrium }
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U atrium -d atrium" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['56379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
        ports: ['51025:1025', '58025:8025']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure .env (generated secrets, local storage)
        run: |
          pnpm atrium --yes setup env
          pnpm atrium config set STORAGE_DRIVER local
      - run: pnpm build
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - name: Start the platform (built servers, background)
        run: |
          pnpm atrium start --prod --detach --no-infra
          for _ in $(seq 1 60); do curl -fsS http://localhost:4000/v1/health/ready && break; sleep 2; done
          pnpm atrium status
      - name: Install Chromium
        run: pnpm --filter @atrium/e2e exec playwright install --with-deps chromium
      - name: Run e2e
        run: pnpm e2e
        env:
          CI: 'true'
          E2E_ADMIN_URL: http://localhost:3000
          E2E_API_URL: http://localhost:4000
          E2E_RENDERER_URL: http://localhost:3001
          E2E_SITES_DOMAIN: sites.localhost:3001
          E2E_MAILPIT_URL: http://localhost:58025
      - name: App logs on failure
        if: failure()
        run: pnpm atrium logs -n 300 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 14
      - if: always()
        run: pnpm atrium stop || true

  images:
    name: Image · ${{ matrix.image }}
    if: github.event_name == 'push'
    needs: [verify, database, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # checkout
      packages: write # push images to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: api, file: api.Containerfile, target: runtime }
          - { image: migrate, file: api.Containerfile, target: migrate }
          - { image: worker, file: worker.Containerfile, target: runtime }
          - { image: renderer, file: renderer.Containerfile, target: runtime }
          - { image: admin, file: admin.Containerfile, target: runtime }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/atrium-${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      # Cache note (zizmor cache-poisoning is suppressed for ci.yml in .github/zizmor.yml): the pnpm/turbo caches only
      # feed lint/test/e2e jobs; the published images are built from source inside the Containerfiles and
      # only use the BuildKit gha cache written by this job on push events. No pull_request_target here.
      # Vulnerability gate BEFORE anything reaches the registry:
      #   1. build the image into the runner's local Docker store (load: true, push: false, local tag only),
      #   2. Trivy-scan that local image — fail on fixable HIGH/CRITICAL,
      #   3. only then build again with push: true. The second build reuses the BuildKit/GHA layer cache
      #      from step 1, so it is cheap and produces the same layers that were scanned; provenance and
      #      SBOM attestations are attached on the push (they cannot be exported with load: true).
      # Scanning the pushed digest instead would publish (and move `latest` to) a vulnerable image first.
      - name: Build (local, for scanning)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/containers/${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: atrium-${{ matrix.image }}:scan
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
            ATRIUM_API_INTERNAL_URL=${{ vars.ATRIUM_API_INTERNAL_URL || 'http://api:4000' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
          sbom: false
      - name: Trivy image scan (fixable HIGH/CRITICAL fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: atrium-${{ matrix.image }}:scan
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          version: v0.70.0 # Trivy binary version (pinned; installed by the action's SHA-pinned setup-trivy)
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/containers/${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
            ATRIUM_API_INTERNAL_URL=${{ vars.ATRIUM_API_INTERNAL_URL || 'http://api:4000' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true
          sbom: true
