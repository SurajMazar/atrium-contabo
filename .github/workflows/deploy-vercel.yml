# Deploy the admin and the multi-tenant renderer to Vercel (prebuilt in CI).
# The API and worker are NOT Vercel workloads — see deploy-containers.yml.
#
# Repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID_ADMIN, VERCEL_PROJECT_ID_RENDERER
# Each Vercel project uses Root Directory apps/admin or apps/renderer with
# "Include files outside the root directory" enabled (docs/deployment/vercel.md).
name: Deploy · Vercel

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Vercel environment
        type: choice
        options: [preview, production]
        default: production
  push:
    branches: [main]
    paths:
      - apps/admin/**
      - apps/renderer/**
      - packages/**
      - pnpm-lock.yaml

concurrency:
  group: deploy-vercel-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ matrix.app }} → Vercel
    # The Contabo mirror deploys to its VPS instead (deploy-contabo.yml).
    if: github.repository != 'SurajMazar/atrium-contabo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'production' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: admin
          - app: renderer
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      # Reference each secret by name (secrets[matrix.x] would expose the whole secrets context).
      # A missing secret yields '' (never the other app's project) and fails the pull step below.
      VERCEL_PROJECT_ID: ${{ matrix.app == 'admin' && secrets.VERCEL_PROJECT_ID_ADMIN || matrix.app == 'renderer' && secrets.VERCEL_PROJECT_ID_RENDERER || '' }}
      VERCEL_ENV: ${{ inputs.environment || 'production' }}
      APP: ${{ matrix.app }}
      VERCEL_CLI_VERSION: 62.2.0 # exact pin; Renovate bumps it (customManagers in renovate.json)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Vercel CLI (pinned)
        # exact version, no lifecycle scripts; tracked by Renovate (renovate.json customManagers)
        run: npm install --global --ignore-scripts "vercel@$VERCEL_CLI_VERSION" # zizmor: ignore[adhoc-packages]
      # The Vercel CLI reads VERCEL_TOKEN from the environment; it is never put on a command line
      # (argv is visible to other processes and ends up in logs on error). Only the vercel steps get it.
      - name: Pull project settings + env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_PROJECT_ID" ]; then echo "::error::Vercel project id secret for $APP is not set"; exit 1; fi
          vercel pull --yes --environment="$VERCEL_ENV"
      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          args=()
          if [ "$VERCEL_ENV" = production ]; then args+=(--prod); fi
          vercel build "${args[@]}"
      - name: Deploy prebuilt output
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          args=(--prebuilt)
          if [ "$VERCEL_ENV" = production ]; then args+=(--prod); fi
          url=$(vercel deploy "${args[@]}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### $APP: $url" >> "$GITHUB_STEP_SUMMARY"
